server {
  listen 80;
  server_name _;
  client_max_body_size 15m;

  root /usr/share/nginx/html;
  index index.html;
  # Compress the static bundle (the /op scripts are ~900 KB raw, ~270 KB gzip).
  # API responses (including the event stream) are left untouched.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript text/javascript image/svg+xml application/json application/manifest+json;

  location /api/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    # A full five-day lesson set may need several structured AI responses.
    # Keep the browser connection alive while the API validates and saves them.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Not hashed, so no "immutable": season patterns change rarely, content media may be replaced in place.
  location ^~ /patterns/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=604800" always;
  }

  location ^~ /media/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
