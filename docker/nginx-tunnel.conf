map "$server_port:$http_host" $e4s_origin {
  default "";
  ~*^80:(localhost|127\.0\.0\.1)(:[0-9]+)?$ local;
  8080:e4s.gfts.vn tunnel;
}

map "$e4s_origin:$http_x_forwarded_proto" $e4s_redirect_https {
  default 0;
  tunnel:https 0;
  ~^tunnel: 1;
}

map $e4s_origin $e4s_client_ip {
  default $remote_addr;
  tunnel $http_cf_connecting_ip;
}

map $e4s_origin $e4s_forwarded_proto {
  default $scheme;
  tunnel https;
}

server {
  listen 80;
  listen 8080;
  server_name localhost 127.0.0.1 e4s.gfts.vn;
  client_max_body_size 15m;

  if ($e4s_origin = "") {
    return 421;
  }

  if ($e4s_redirect_https) {
    return 308 https://e4s.gfts.vn$request_uri;
  }

  root /usr/share/nginx/html;
  index index.html;
  # Compress the static bundle (the /op scripts are ~900 KB raw, ~270 KB gzip).
  # API responses (including the event stream) are left untouched.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript text/javascript image/svg+xml application/json application/manifest+json;
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $e4s_api http://api:3001;
    proxy_pass $e4s_api;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $e4s_client_ip;
    proxy_set_header X-Forwarded-Proto $e4s_forwarded_proto;
    proxy_set_header Forwarded "";
  }

  location ~ ^/season-english/staff(?:/forgot-password)?/?$ {
    try_files /index.html =404;
    default_type text/html;
    sub_filter '</head>' '<meta name="e4s-entry" content="staff" /></head>';
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    access_log off;
  }

  location ~ ^/login/?$ {
    absolute_redirect off;
    return 302 /$is_args$args;
  }

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Not hashed, so no "immutable": season patterns change rarely, content media may be replaced in place.
  location ^~ /patterns/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=604800" always;
  }

  location ^~ /media/ {
    # Listening audio moved from WAV to MP3; published assessment versions are immutable, so their stored .wav links are answered with the MP3.
    location ~ ^/media/audio/(placement-listening-L[ABC]|pass-course-form-a-listening-[abc])\.wav$ {
      add_header Cache-Control "public, max-age=86400" always;
      try_files /media/audio/$1.mp3 =404;
    }
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
