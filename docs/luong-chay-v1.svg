<!-- ===== Tech strip ===== -->
<text x="60" y="1032" class="lanelbl">LỚP KỸ THUẬT (gọi từ trình duyệt)</text>
<g><rect x="60" y="1042" width="350" height="78" class="box" fill="#FFFFFF" rx="10"/><text x="235" y="1066" text-anchor="middle" class="t">Dữ liệu: localStorage key aec:v1</text><text x="235" y="1086" text-anchor="middle" class="s">users · weeks · lessonSets · progress · activity · tests</text><text x="235" y="1102" text-anchor="middle" class="s">coachSessions · submissions · reminders · xuất/nhập JSON</text></g>
<g><rect x="450" y="1042" width="350" height="78" class="box" fill="#E6E1FF" rx="10"/><text x="625" y="1066" text-anchor="middle" class="t">AI provider (chọn trong Cài đặt)</text><text x="625" y="1086" text-anchor="middle" class="s">Claude · Gemini · Groq / OpenRouter / Ollama (OpenAI-compatible)</text><text x="625" y="1102" text-anchor="middle" class="s">4 lời gọi JSON: xếp mức · sinh bài · coach · chấm bài</text></g>
<g><rect x="840" y="1042" width="350" height="78" class="box" fill="#8FE0C0" rx="10"/><text x="1015" y="1066" text-anchor="middle" class="t">Web Speech API</text><text x="1015" y="1086" text-anchor="middle" class="s">TTS: đọc audio phần Nghe (tối đa 2 lần), đọc từ vựng</text><text x="1015" y="1102" text-anchor="middle" class="s">STT: phần Nói, coach, bài nộp · chấm nội dung, không chấm phát âm</text></g>
<g><rect x="1230" y="1042" width="350" height="78" class="box" fill="#FFD56B" rx="10"/><text x="1405" y="1066" text-anchor="middle" class="t">Base.vn incoming webhook</text><text x="1405" y="1086" text-anchor="middle" class="s">POST fetch mode no-cors, payload {"base_content": "…"}</text><text x="1405" y="1102" text-anchor="middle" class="s">không đọc được phản hồi → luôn có nút Copy dự phòng</text></g>
</svg>
