<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1140" viewBox="0 0 1640 1140" font-family="Segoe UI, Arial, sans-serif">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#2E2545"/></marker>
  <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#6B5BD6"/></marker>
  <style>
    .lane{fill:#FFFFFF;stroke:#2E2545;stroke-width:1.5;rx:16}
    .lanelbl{font-size:15px;font-weight:700;fill:#6A6485;letter-spacing:.06em}
    .box{stroke:#2E2545;stroke-width:2;rx:14}
    .t{font-size:14px;font-weight:700;fill:#2E2545}
    .s{font-size:11.5px;fill:#2E2545}
    .m{font-size:11.5px;fill:#6A6485}
    .arr{fill:none;stroke:#2E2545;stroke-width:1.8;marker-end:url(#ar)}
    .arrp{fill:none;stroke:#6B5BD6;stroke-width:1.8;marker-end:url(#ar2)}
    .dash{fill:none;stroke:#6A6485;stroke-width:1.5;stroke-dasharray:6 5;marker-end:url(#ar)}
    .step{font-size:11px;font-weight:700;fill:#FFFFFF}
  </style>
</defs>
<rect width="1640" height="1140" fill="#F4F1FF"/>
<text x="60" y="44" font-size="24" font-weight="800" fill="#2E2545">Chippi – GFT English Coach · Luồng chạy</text>
<text x="60" y="66" class="m">1 file index.html, không backend · 3 vai trò · pilot 2–4 tuần, mỗi tuần một chủ đề, bài theo mức CEFR từng người</text>

<!-- ===== Lane: Học viên ===== -->
<rect x="40" y="80" width="1560" height="320" class="lane"/>
<text x="60" y="106" class="lanelbl">NGƯỜI HỌC</text>
<g><rect x="60" y="200" width="190" height="100" class="box" fill="#FFD56B"/><circle cx="76" cy="216" r="10" fill="#2E2545"/><text x="76" y="220" text-anchor="middle" class="step">1</text>
  <text x="155" y="236" text-anchor="middle" class="t">Vào app: "Bạn là…"</text><text x="155" y="256" text-anchor="middle" class="s">Người học: họ tên + PIN</text><text x="155" y="272" text-anchor="middle" class="s">(tự đăng ký, không thấy người khác)</text><text x="155" y="288" text-anchor="middle" class="m">VH/QL: chọn tài khoản + PIN vai trò</text></g>
<g><rect x="280" y="200" width="190" height="100" class="box" fill="#FFFFFF"/><circle cx="296" cy="216" r="10" fill="#2E2545"/><text x="296" y="220" text-anchor="middle" class="step">2</text>
  <text x="375" y="236" text-anchor="middle" class="t">Hồ sơ cá nhân</text><text x="375" y="256" text-anchor="middle" class="s">công việc · mục đích dùng TA</text><text x="375" y="272" text-anchor="middle" class="s">phong cách học · chứng chỉ</text><text x="375" y="288" text-anchor="middle" class="m">→ đưa vào prompt AI</text></g>
<g><rect x="500" y="200" width="190" height="100" class="box" fill="#FF9EAA"/><circle cx="516" cy="216" r="10" fill="#2E2545"/><text x="516" y="220" text-anchor="middle" class="step">3</text>
  <text x="595" y="236" text-anchor="middle" class="t">Test đầu vào (đề GFT)</text><text x="595" y="254" text-anchor="middle" class="s">Nghe · Đọc · Viết · Nói, 4×25đ</text><text x="595" y="270" text-anchor="middle" class="s">tính giờ từng phần, auto nộp</text><text x="595" y="286" text-anchor="middle" class="s">cảnh báo rời màn hình (3 lần)</text></g>
<g><rect x="720" y="200" width="190" height="100" class="box" fill="#FFFFFF" stroke-dasharray="6 4"/><circle cx="736" cy="216" r="10" fill="#2E2545"/><text x="736" y="220" text-anchor="middle" class="step">4</text>
  <text x="815" y="240" text-anchor="middle" class="t">Chờ duyệt mức</text><text x="815" y="262" text-anchor="middle" class="s">Nghe/Đọc chấm tự động</text><text x="815" y="278" text-anchor="middle" class="s">Viết/Nói: AI hoặc chấm tay</text></g>
<g><rect x="940" y="200" width="190" height="100" class="box" fill="#8FE0C0"/><circle cx="956" cy="216" r="10" fill="#2E2545"/><text x="956" y="220" text-anchor="middle" class="step">5</text>
  <text x="1035" y="236" text-anchor="middle" class="t">Trang chủ tuần N</text><text x="1035" y="256" text-anchor="middle" class="s">bộ bài đã duyệt theo mức</text><text x="1035" y="272" text-anchor="middle" class="s">dots 7 ngày · mục tiêu phút/ngày</text><text x="1035" y="288" text-anchor="middle" class="m">banner nhắc nếu bỏ ≥2 ngày</text></g>
<g><rect x="1160" y="200" width="190" height="30" class="box" fill="#FFFFFF" rx="8"/><text x="1255" y="219" text-anchor="middle" class="s"><tspan font-weight="700">6a</tspan> Học bài 10–15′ (4 phần + bài tập)</text>
   <rect x="1160" y="235" width="190" height="30" class="box" fill="#FF9EAA" rx="8"/><text x="1255" y="254" text-anchor="middle" class="s"><tspan font-weight="700">6b</tspan> Luyện với Chippi ≥2 lượt/tuần</text>
   <rect x="1160" y="270" width="190" height="30" class="box" fill="#FFD56B" rx="8"/><text x="1255" y="289" text-anchor="middle" class="s"><tspan font-weight="700">6c</tspan> Bài nộp thứ Sáu (AI chấm rubric)</text></g>
<g><rect x="1380" y="200" width="190" height="100" class="box" fill="#FFFFFF"/><circle cx="1396" cy="216" r="10" fill="#2E2545"/><text x="1396" y="220" text-anchor="middle" class="step">7</text>
  <text x="1475" y="236" text-anchor="middle" class="t">Tuần cuối</text><text x="1475" y="256" text-anchor="middle" class="s">Test cuối kỳ (cùng đề/rubric)</text><text x="1475" y="272" text-anchor="middle" class="s">Khảo sát hài lòng 1–5</text><text x="1475" y="288" text-anchor="middle" class="m">so điểm đầu vào → cuối</text></g>
<text x="60" y="384" class="m">Mỗi hoạt động (bài học, coach, bài nộp, test) ghi activity(ngày, loại, phút) → tính số buổi/tuần, streak, phát hiện bỏ ≥2 ngày.</text>
<line x1="250" y1="250" x2="278" y2="250" class="arr"/><line x1="470" y1="250" x2="498" y2="250" class="arr"/><line x1="690" y1="250" x2="718" y2="250" class="arr"/><line x1="910" y1="250" x2="938" y2="250" class="arr"/><line x1="1130" y1="250" x2="1158" y2="250" class="arr"/><line x1="1350" y1="250" x2="1378" y2="250" class="arr"/>
<path d="M1035 196 L1035 150 L1255 150 L1255 196" fill="none" stroke="#6A6485" stroke-width="1.2" stroke-dasharray="4 4"/><text x="1145" y="144" text-anchor="middle" class="m">lặp hằng tuần: T2 nhận bài → trong tuần học/luyện → T6 nộp</text>

<!-- ===== Lane: Vận hành ===== -->
<rect x="40" y="420" width="1560" height="300" class="lane"/>
<text x="60" y="446" class="lanelbl">NGƯỜI VẬN HÀNH (thực tập sinh)</text>
<g><rect x="60" y="530" width="190" height="100" class="box" fill="#FFFFFF"/><text x="155" y="556" text-anchor="middle" class="t">Cài đặt</text><text x="155" y="576" text-anchor="middle" class="s">AI provider + key · lịch pilot</text><text x="155" y="592" text-anchor="middle" class="s">giờ test · webhook Base.vn · PIN</text><text x="155" y="608" text-anchor="middle" class="m">người dùng: thêm/xoá, đặt lại PIN</text></g>
<g><rect x="280" y="530" width="190" height="100" class="box" fill="#FFFFFF"/><text x="375" y="560" text-anchor="middle" class="t">Khung chủ đề tuần</text><text x="375" y="582" text-anchor="middle" class="s">chủ đề · mô tả · mục tiêu</text><text x="375" y="598" text-anchor="middle" class="s">gợi ý từ khoá</text></g>
<g><rect x="500" y="530" width="190" height="100" class="box" fill="#E6E1FF"/><text x="595" y="556" text-anchor="middle" class="t">Sinh bài bằng AI</text><text x="595" y="576" text-anchor="middle" class="s">tuần × mức CEFR → 3–4 bài</text><text x="595" y="592" text-anchor="middle" class="s">A1–A2 giải thích tiếng Việt</text><text x="595" y="608" text-anchor="middle" class="s">B1+ toàn tiếng Anh · JSON schema</text></g>
<g><rect x="720" y="530" width="190" height="100" class="box" fill="#8FE0C0"/><text x="815" y="556" text-anchor="middle" class="t">Duyệt trình độ</text><text x="815" y="576" text-anchor="middle" class="s">xem điểm 4 kỹ năng, hồ sơ,</text><text x="815" y="592" text-anchor="middle" class="s">nhật ký cảnh báo · AI gợi ý mức</text><text x="815" y="608" text-anchor="middle" class="s">chấm tay Viết/Nói theo rubric</text></g>
<g><rect x="940" y="530" width="190" height="100" class="box" fill="#8FE0C0"/><text x="1035" y="560" text-anchor="middle" class="t">Duyệt bộ bài</text><text x="1035" y="582" text-anchor="middle" class="s">xem/sửa JSON → Duyệt</text><text x="1035" y="598" text-anchor="middle" class="s">chỉ bộ đã duyệt mới hiện</text></g>
<g><rect x="1160" y="530" width="190" height="100" class="box" fill="#FFFFFF"/><text x="1255" y="556" text-anchor="middle" class="t">Đọc mẫu &amp; kiểm tra AI</text><text x="1255" y="576" text-anchor="middle" class="s">bài nộp T6 · phản hồi coach</text><text x="1255" y="592" text-anchor="middle" class="s">chấm tay nếu không có AI</text><text x="1255" y="608" text-anchor="middle" class="m">đánh dấu "đã đọc mẫu"</text></g>
