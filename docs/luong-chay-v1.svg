<g><rect x="940" y="830" width="190" height="100" class="box" fill="#E6E1FF"/><text x="1035" y="856" text-anchor="middle" class="t">Tiến độ nhóm · 4 KPI</text><text x="1035" y="876" text-anchor="middle" class="s">học đều ≥3 buổi/tuần ≥70%</text><text x="1035" y="892" text-anchor="middle" class="s">đến cuối ≥60% · tiến bộ ≥70%</text><text x="1035" y="908" text-anchor="middle" class="s">hài lòng ≥4/5 · bảng từng người</text></g>
<g><rect x="1160" y="830" width="190" height="100" class="box" fill="#FF9EAA"/><text x="1255" y="856" text-anchor="middle" class="t">Nhắc học</text><text x="1255" y="876" text-anchor="middle" class="s">tự phát hiện bỏ ≥2 ngày</text><text x="1255" y="892" text-anchor="middle" class="s">gửi Base.vn webhook</text><text x="1255" y="908" text-anchor="middle" class="s">hoặc copy tin nhắn</text></g>
