name: e4s-local

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: e4s
      POSTGRES_USER: e4s
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-e4s_local_password}
    ports:
      - "${E4S_POSTGRES_PORT:-5433}:5432"
    volumes:
      - e4s-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e4s -d e4s"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    # The upstream minio/minio image was removed from Docker Hub.  Use the
    # maintained compatible build so a new local checkout can still start.
    # Pinned to the image the live site runs (built 2025-10-27). Update deliberately, never via :latest.
    image: coollabsio/minio@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-e4s_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-e4s_local_minio_password}
    ports:
      - "${E4S_MINIO_PORT:-9002}:9000"
      - "${E4S_MINIO_CONSOLE_PORT:-9003}:9001"
    volumes:
      - e4s-minio:/data
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    build:
      context: .
      dockerfile: Dockerfile.local
      target: local-runtime
    command: ["pnpm", "--filter", "@e4s/storage", "exec", "tsx", "scripts/ensure-local-buckets.ts"]
    depends_on:
      minio:
        condition: service_started
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-e4s_minio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-e4s_local_minio_password}
      S3_EVIDENCE_BUCKET: ${S3_EVIDENCE_BUCKET:-e4s-evidence}
      S3_MEDIA_BUCKET: ${S3_MEDIA_BUCKET:-e4s-media}
    restart: "no"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.local
      target: local-runtime
    command: ["pnpm", "exec", "tsx", "scripts/prepare-local.ts"]
    environment:
      DATABASE_URL: postgres://e4s:${POSTGRES_PASSWORD:-e4s_local_password}@postgres:5432/e4s
      E4S_SEED_SCENARIOS: "true"
      E4S_SETTINGS_ENCRYPTION_KEY: ${E4S_SETTINGS_ENCRYPTION_KEY:?E4S_SETTINGS_ENCRYPTION_KEY is required}
      # Demo logins come from .env only (random values are generated and printed when unset).
      E4S_DEMO_LEARNER_PIN: ${E4S_DEMO_LEARNER_PIN:-}
      E4S_DEMO_STAFF_PASSWORD: ${E4S_DEMO_STAFF_PASSWORD:-}
      E4S_DEMO_MANAGER_PASSWORD: ${E4S_DEMO_MANAGER_PASSWORD:-}
      E4S_SCENARIO_STAFF_PASSWORD: ${E4S_SCENARIO_STAFF_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.local
      target: local-api
    command: ["pnpm", "exec", "tsx", "apps/api/src/server.ts"]
    environment:
      HOST: 0.0.0.0
      E4S_ENABLE_EDGE_TTS: ${E4S_ENABLE_EDGE_TTS:-true}
      PORT: 3001
      DATABASE_URL: postgres://e4s:${POSTGRES_PASSWORD:-e4s_local_password}@postgres:5432/e4s
      E4S_SETTINGS_ENCRYPTION_KEY: ${E4S_SETTINGS_ENCRYPTION_KEY:?E4S_SETTINGS_ENCRYPTION_KEY is required}
      ALLOW_DEMO_LOGIN: "true"
      COOKIE_SECURE: "false"
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-e4s_minio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-e4s_local_minio_password}
      S3_EVIDENCE_BUCKET: ${S3_EVIDENCE_BUCKET:-e4s-evidence}
      S3_MEDIA_BUCKET: ${S3_MEDIA_BUCKET:-e4s-media}
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
      # Hard ceiling on AI calls per monthly resource generation request (progress is kept when it is reached).
      MONTHLY_RESOURCE_AI_CALL_LIMIT: ${MONTHLY_RESOURCE_AI_CALL_LIMIT:-800}
      # Core-word illustrations (monthly resources). Leave the key empty to disable AI images.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-}
      # Daily Speaking speech-to-text (empty = gpt-4o-mini-transcribe, "off" = keep recordings for the operator).
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      IMAGE_GENERATION_CONCURRENCY: ${IMAGE_GENERATION_CONCURRENCY:-6}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-E4S <no-reply@e4s.gfts.vn>}
      AUTH_OTP_SECRET: ${AUTH_OTP_SECRET:-local-only-change-me}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3.8-27b}
      VOCAB_IMAGE_SOURCE: ${VOCAB_IMAGE_SOURCE:-wikimedia}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      PIXABAY_API_KEY: ${PIXABAY_API_KEY:-}
    ports:
      - "${E4S_API_PORT:-3001}:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/readiness').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: Dockerfile.local
      target: local-runtime
    command: ["pnpm", "exec", "tsx", "apps/worker/src/server.ts"]
    environment:
      DATABASE_URL: postgres://e4s:${POSTGRES_PASSWORD:-e4s_local_password}@postgres:5432/e4s
      E4S_SETTINGS_ENCRYPTION_KEY: ${E4S_SETTINGS_ENCRYPTION_KEY:?E4S_SETTINGS_ENCRYPTION_KEY is required}
      WORKER_POLL_MS: 1000
      WORKER_LEASE_SECONDS: 60
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-e4s_minio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-e4s_local_minio_password}
      S3_BUCKET: ${S3_EVIDENCE_BUCKET:-e4s-evidence}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3.8-27b}
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "process.kill(1, 0)"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "${E4S_WEB_PORT:-4175}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  e4s-postgres:
  e4s-minio:
