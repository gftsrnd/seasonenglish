<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E4S Home visual comparison</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px; background: #d9dde3; color: #172033; font-family: Arial, sans-serif; }
      h1 { margin: 0 0 18px; font-size: 24px; }
      h2 { grid-column: 1 / -1; margin: 20px 0 0; font-size: 20px; }
      .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
      figure { margin: 0; padding: 12px; border-radius: 12px; background: #fff; box-shadow: 0 4px 18px rgba(20, 32, 50, .12); }
      figcaption { padding: 4px 4px 12px; font-size: 18px; font-weight: 700; }
      img { display: block; width: 100%; height: auto; border: 1px solid #c9ced6; }
    </style>
  </head>
  <body>
    <h1>Home — prototype gốc và bản triển khai hiện tại</h1>
    <main class="compare">
      <h2>Trang chủ</h2>
      <figure>
        <figcaption>Prototype của Thư (chuẩn đối chiếu)</figcaption>
        <img src="./source-home.png" alt="Prototype Home của Thư" />
      </figure>
      <figure>
        <figcaption>Bản triển khai sau chuẩn hoá lần 1</figcaption>
        <img src="./current-home.png" alt="Bản Home hiện tại" />
      </figure>
      <h2>Hồ sơ ban đầu / sửa hồ sơ</h2>
      <figure>
        <figcaption>Prototype của Thư</figcaption>
        <img src="./source-onboard.png" alt="Prototype Onboard của Thư" />
      </figure>
      <figure>
        <figcaption>Bản triển khai sau chuẩn hoá lần 1</figcaption>
        <img src="./current-onboard.png" alt="Bản Onboard hiện tại" />
      </figure>
      <h2>Tiến độ & hồ sơ</h2>
      <figure>
        <figcaption>Prototype của Thư</figcaption>
        <img src="./source-profile.png" alt="Prototype Profile của Thư" />
      </figure>
      <figure>
        <figcaption>Bản triển khai sau chuẩn hoá lần 1</figcaption>
        <img src="./current-profile.png" alt="Bản Profile hiện tại" />
      </figure>
      <h2>Bài học</h2>
      <figure>
        <figcaption>Prototype của Thư</figcaption>
        <img src="./source-lesson.png" alt="Prototype Lesson của Thư" />
      </figure>
      <figure>
        <figcaption>Bản triển khai sau chuẩn hoá lần 1</figcaption>
        <img src="./current-lesson.png" alt="Bản Lesson hiện tại" />
      </figure>
    </main>
  </body>
</html>
