<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 216 96">
      <title>Pháo hoa mở rương</title>
      <style>
        @media (prefers-reduced-motion: no-preference) {
          .burst { animation: bloom .72s cubic-bezier(.19,.74,.28,1) var(--wait) both; }
          .trail { animation: launch .48s ease-out .03s both; }
          @keyframes bloom {
            0% { transform: scale(.12); opacity: 0; }
            20% { opacity: 1; }
            72% { opacity: 1; }
            100% { transform: scale(1); opacity: .88; }
          }
          @keyframes launch {
            0% { stroke-dashoffset: 1; opacity: 0; }
            23% { opacity: 1; }
            73% { opacity: .8; }
            100% { stroke-dashoffset: 0; opacity: .35; }
          }
        }
      </style>
