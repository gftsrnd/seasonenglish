# Runs on every push and pull request: typecheck, media checks, all tests (Postgres service), web build.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Same Postgres image as production. The embedded-postgres npm build (18.4.0-beta.17) ships without dist/,
    # so a fresh install cannot start it; tests use this service through TEST_DATABASE_URL instead.
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: e4s
          POSTGRES_PASSWORD: e4s_test_password
          POSTGRES_DB: e4s_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U e4s -d e4s_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://e4s:e4s_test_password@127.0.0.1:5432/e4s_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version comes from "packageManager" in package.json.

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Media and pronunciation assets
        run: |
          pnpm verify:media
          pnpm verify:pronunciation
          pnpm verify:app-media

      - name: Tests (Postgres service)
        run: pnpm test

      - name: Build web
        run: pnpm --filter @e4s/web build
