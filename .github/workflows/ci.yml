# Runs on every push and pull request: typecheck, media checks, all tests (embedded Postgres), web build.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version comes from "packageManager" in package.json.

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Media and pronunciation assets
        run: |
          pnpm verify:media
          pnpm verify:pronunciation
          pnpm verify:app-media

      - name: Tests (embedded Postgres)
        run: pnpm test

      - name: Build web
        run: pnpm --filter @e4s/web build
