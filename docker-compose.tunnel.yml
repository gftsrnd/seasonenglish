services:
  postgres:
    restart: unless-stopped
    ports: !reset []

  minio:
    restart: unless-stopped
    ports: !reset []

  migrate:
    command: ["pnpm", "exec", "tsx", "scripts/prepare-deployment.ts"]
    environment:
      E4S_SEED_SCENARIOS: "false"

  api:
    restart: unless-stopped
    ports: !reset []
    environment:
      COOKIE_SECURE: "true"

  web:
    build:
      args:
        VITE_E4S_STAFF_DIRECT_ENTRY: "1"
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:${E4S_WEB_PORT:-4175}:80"
    volumes:
      - ./docker/nginx-tunnel.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/readiness"]

  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    command: ["tunnel", "--no-autoupdate", "run", "--token-file", "/run/secrets/cloudflare_tunnel_token"]
    restart: unless-stopped
    secrets:
      - cloudflare_tunnel_token

secrets:
  cloudflare_tunnel_token:
    file: "${LOCALAPPDATA:?LOCALAPPDATA is required}/E4S/cloudflare-tunnel-token.txt"
