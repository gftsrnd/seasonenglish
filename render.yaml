services:
  - type: web
    name: e4s-api
    runtime: node
    plan: free
    region: singapore
    branch: gftsaimedia-cpu
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: sh -c 'pnpm exec tsx scripts/prepare-local.ts && (pnpm exec tsx apps/worker/src/server.ts &) && exec pnpm --filter @e4s/api start'
    healthCheckPath: /api/readiness
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: "true"
      - key: WEB_ORIGIN
        value: https://e4s-web.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: us-east-1
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_EVIDENCE_BUCKET
        value: e4s-evidence
      - key: S3_MEDIA_BUCKET
        value: e4s-media
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: PEXELS_API_KEY
        sync: false
      - key: PIXABAY_API_KEY
        sync: false

  - type: web
    name: e4s-web
    runtime: static
    branch: gftsaimedia-cpu
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @e4s/web... build
    staticPublishPath: apps/web/dist
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: VITE_API_BASE_URL
        value: https://e4s-api.onrender.com
