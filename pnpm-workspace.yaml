packages:
  - apps/*
  - packages/*

allowBuilds:
  '@embedded-postgres/darwin-arm64': set this to true or false
  '@embedded-postgres/darwin-x64': set this to true or false
  '@embedded-postgres/linux-arm': set this to true or false
  '@embedded-postgres/linux-arm64': set this to true or false
  '@embedded-postgres/linux-ia32': set this to true or false
  '@embedded-postgres/linux-ppc64': set this to true or false
  '@embedded-postgres/linux-x64': true
  '@embedded-postgres/windows-x64': true
  esbuild: true

minimumReleaseAgeExclude:
  - fastify@5.12.7
  - zod@4.6.7
  - '@aws-sdk/client-s3@3.1151.0'
